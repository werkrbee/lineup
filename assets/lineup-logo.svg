<svg viewBox="0 0 760 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="lineup — the RSVP product of SportsCopilot">
  <title>lineup — a lineup of players with one open spot</title>
  <desc>The lineup mark — four filled player figures and one dashed open spot on a honey baseline — beside the wordmark lineup, with the tagline first come, first served.</desc>

  <rect x="1.5" y="1.5" width="757" height="237" rx="30" fill="#FBF6EA" stroke="#EADFC6" stroke-width="2.5"/>

  <!-- mark -->
  <g transform="translate(36,34) scale(0.78)">
    <rect x="18" y="156" width="204" height="7" rx="3.5" fill="#F2A81D"/>
    <g>
      <path d="M25,150 L25,124 Q25,108 40,108 Q55,108 55,124 L55,150 Z" fill="#17140F"/>
      <circle cx="40" cy="92" r="11" fill="#F2A81D" stroke="#17140F" stroke-width="3"/>
      <path d="M65,150 L65,124 Q65,108 80,108 Q95,108 95,124 L95,150 Z" fill="#17140F"/>
      <circle cx="80" cy="92" r="11" fill="#F2A81D" stroke="#17140F" stroke-width="3"/>
      <path d="M105,150 L105,124 Q105,108 120,108 Q135,108 135,124 L135,150 Z" fill="#17140F"/>
      <circle cx="120" cy="92" r="11" fill="#F2A81D" stroke="#17140F" stroke-width="3"/>
      <path d="M145,150 L145,124 Q145,108 160,108 Q175,108 175,124 L175,150 Z" fill="#17140F"/>
      <circle cx="160" cy="92" r="11" fill="#F2A81D" stroke="#17140F" stroke-width="3"/>
    </g>
    <g fill="none" stroke="#17140F" stroke-width="3" stroke-dasharray="5 4" stroke-linejoin="round">
      <path d="M185,150 L185,124 Q185,108 200,108 Q215,108 215,124 L215,150 Z"/>
      <circle cx="200" cy="92" r="11"/>
    </g>
  </g>

  <!-- wordmark -->
  <g font-family="'Poppins','Futura','Century Gothic','Trebuchet MS','Helvetica Neue',Arial,sans-serif">
    <text x="252" y="130" font-size="76" font-weight="800" letter-spacing="-3" fill="#17140F">line<tspan fill="#F2A81D">up</tspan></text>
    <rect x="254" y="148" width="54" height="4" rx="2" fill="#F2A81D"/>
    <text x="254" y="180" font-size="15.5" font-weight="700" letter-spacing="2.6" fill="#17140F">"I'M IN" · FIRST COME, FIRST SERVED</text>
    <text x="254" y="204" font-size="14.5" font-weight="500" letter-spacing="0.5" fill="#7A6B4F">The RSVP product of the SportsCopilot platform</text>
  </g>
</svg>
